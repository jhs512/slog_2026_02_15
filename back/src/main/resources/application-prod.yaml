spring:
  data:
    redis:
      password: "${SPRING__DATA__REDIS__PASSWORD}"
  datasource:
    password: "${SPRING__DATASOURCE__PASSWORD}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        use_sql_comments: false
    show-sql: false
# API 문서 엔드포인트는 운영에 노출하지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    com.back: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.orm.jdbc.extract: INFO
    org.hibernate.orm.jdbc.batch: INFO
    org.springframework.transaction.interceptor: INFO
custom:
  # dev 기본값이 prod로 새지 않도록 기본값 없이 재선언 — 미설정 시 기동이 명확히 실패한다
  jwt:
    secretKey: "${CUSTOM__JWT__SECRET_KEY}"
  systemMemberApiKey: "${CUSTOM__SYSTEM_MEMBER_API_KEY}"
  site:
    cookieDomain: "${custom.prod.cookieDomain}"
    frontUrl: "${custom.prod.frontUrl}"
    backUrl: "${custom.prod.backUrl}"
    dbHost: "${custom.prod.dbHost}"
    dbName: "${custom.prod.dbName}"
    redisHost: "${custom.prod.redisHost}"
    redisDatabase: "${custom.prod.redisDatabase}"
  task:
    processor:
      fixedDelayMs: "#{1000*3}"